[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "unstrikeable"
version = "0.1.0.dev0"
description = "The company that never goes on strike: AI agents working a ticket board through a YAML flow."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
uns = "unstrikeable.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/unstrikeable"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
